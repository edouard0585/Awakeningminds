name: Publier l'article de la semaine
on:
  schedule:
    - cron: '0 7 * * 1'   # chaque lundi 07:00 UTC
  workflow_dispatch: {}    # + déclenchement manuel depuis l'onglet Actions
permissions:
  contents: write
  pages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publier le prochain article
        run: python3 _tools/publish_next.py
      - name: Commit et push
        run: |
          git config user.name "awakening-minds-blog"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Rien à publier" && exit 0
          git commit -m "blog: article de la semaine"
          git push
      - name: Demander la reconstruction GitHub Pages
        if: success()
        run: |
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
