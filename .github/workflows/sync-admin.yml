name: Appliquer les modifications de l'espace privé
on:
  schedule:
    - cron: '11 * * * *'   # chaque heure
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
concurrency:
  group: blog-publication
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lire et appliquer les modifications
        id: s
        run: |
          python3 _tools/sync_admin.py | tee sortie.txt
          grep -q '✓ appliqué' sortie.txt && echo "nouveau=1" >> "$GITHUB_OUTPUT" || true
          rm sortie.txt
      - name: Commit et push
        if: steps.s.outputs.nouveau == '1'
        run: |
          git config user.name "awakening-minds-blog"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "blog: modifications de l'espace privé"
          git pull --rebase && git push
      - name: Demander la reconstruction GitHub Pages
        if: steps.s.outputs.nouveau == '1'
        run: |
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
